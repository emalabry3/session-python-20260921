<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>python</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }
    .card-header {
      padding: 2rem;
      border-bottom: 1px solid #2d3748;
      background: linear-gradient(135deg, #1a1f2e 0%, #1e2a3a 100%);
    }
    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f7fafc;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    .meta {
      font-size: 0.875rem;
      color: #718096;
    }
    .section {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #2d3748;
    }
    .section:last-child { border-bottom: none; }
    .section h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #718096;
      margin-bottom: 1rem;
    }
    .resource-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .resource-list a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #90cdf4;
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .resource-list a:hover {
      border-color: #4a90d9;
      background: #162032;
    }
    .icon { font-size: 1.1em; flex-shrink: 0; }
    .footer {
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>python</h1>
      <p class="meta">2026-09-21 &mdash; second essai — Présentiel</p>
    </div>
    
  <section class="section">
    <h2>Ressources</h2>
    <ul class="resource-list">
      
      <li>
        <a href="https://raw.githubusercontent.com/emalabry3/session-python-20260921/main/support-apprenant.pdf" target="_blank" download>
          <span class="icon">📄</span>
          support-apprenant.pdf
        </a>
      </li>
    </ul>
  </section>
    
    <div class="footer">Généré par OakDiapo</div>
  </div>
</body>
</html>
